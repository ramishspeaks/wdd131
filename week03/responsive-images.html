<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images Activity</title>

    <link rel="stylesheet" href="styles/responsive-images.css">
</head>

<body>

<header>
    <h1>Responsive Images Activity</h1>
</header>

<main>

    <picture>

        <!-- Large Screen -->
        <source
            media="(min-width: 1000px)"
            srcset="images/hero-large.webp">

        <!-- Medium Screen -->
        <source
            media="(min-width: 500px)"
            srcset="images/hero-medium.webp">

        <!-- Small Screen -->
        <img
            src="images/hero-small.webp"
            alt="Temple Image">

    </picture>

</main>

</body>
</html>
