<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description" content="Submit a product review and rating for selected products using this product review form.">
    <meta name="author" content="Ramish Lal Khokhar">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->

            <div class="form-group">
                <label for="product">Product Name *</label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <!-- Overall Rating -->

            <fieldset>
                <legend>Overall Rating *</legend>

                <div class="rating-group">

                    <label for="rating1">
                        ☆
                        <input
                            type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required>
                    </label>

                    <label for="rating2">
                        ☆☆
                        <input
                            type="radio"
                            id="rating2"
                            name="rating"
                            value="2"
                            required>
                    </label>

                    <label for="rating3">
                        ☆☆☆
                        <input
                            type="radio"
                            id="rating3"
                            name="rating"
                            value="3"
                            required>
                    </label>

                    <label for="rating4">
                        ☆☆☆☆
                        <input
                            type="radio"
                            id="rating4"
                            name="rating"
                            value="4"
                            required>
                    </label>

                    <label for="rating5">
                        ☆☆☆☆☆
                        <input
                            type="radio"
                            id="rating5"
                            name="rating"
                            value="5"
                            required>
                    </label>

                </div>
            </fieldset>

            <!-- Date of Installation -->

            <div class="form-group">
                <label for="installDate">
                    Date of Installation *
                </label>

                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required>
            </div>

            <!-- Useful Features -->

            <fieldset>
                <legend>
                    Useful Features
                    <br>
                    <span>(Check all that apply)</span>
                </legend>

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability">
                    <label for="durability">Durability</label>

                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use">
                    <label for="ease">Ease of Use</label>

                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance">
                    <label for="performance">Performance</label>

                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design">
                    <label for="design">Design</label>

                </div>
            </fieldset>

            <!-- Written Review -->

            <div class="form-group">
                <label for="review">
                    Written Review (Optional)
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"></textarea>
            </div>

            <!-- User Name -->

            <div class="form-group">
                <label for="username">
                    Your Name (Optional)
                </label>

                <input
                    type="text"
                    id="username"
                    name="username">
            </div>

            <!-- Submit Button -->

            <input
                type="submit"
                value="Post Review"
                class="submit-btn">

        </form>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Ramish Lal Khokhar | Pakistan
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
