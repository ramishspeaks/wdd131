<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description" content="Submit a product review and rating for selected products.">
    <meta name="author" content="Ramish Lal Khokhar">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->

            <div class="form-group">
                <label for="product">Product Name *</label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <!-- Overall Rating -->

            <fieldset>
                <legend>Overall Rating *</legend>

                <label>
                    <input type="radio" name="rating" value="1" required>
                    ☆
                </label>

                <label>
                    <input type="radio" name="rating" value="2">
                    ☆☆
                </label>

                <label>
                    <input type="radio" name="rating" value="3">
                    ☆☆☆
                </label>

                <label>
                    <input type="radio" name="rating" value="4">
                    ☆☆☆☆
                </label>

                <label>
                    <input type="radio" name="rating" value="5">
                    ☆☆☆☆☆
                </label>
            </fieldset>

            <!-- Date -->

            <div class="form-group">
                <label for="installDate">
                    Date of Installation *
                </label>

                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required>
            </div>

            <!-- Features -->

            <fieldset>
                <legend>
                    Useful Features
                    <span>(Check all that apply)</span>
                </legend>

                <label>
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability">

                    Durability
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use">

                    Ease of Use
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance">

                    Performance
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design">

                    Design
                </label>
            </fieldset>

            <!-- Review -->

            <div class="form-group">
                <label for="review">
                    Written Review (Optional)
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"></textarea>
            </div>

            <!-- User Name -->

            <div class="form-group">
                <label for="username">
                    Your Name (Optional)
                </label>

                <input
                    type="text"
                    id="username"
                    name="username">
            </div>

            <!-- Submit -->

            <input
                type="submit"
                value="Post Review"
                class="submit-btn">

        </form>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Ramish Lal Khokhar | Pakistan
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
