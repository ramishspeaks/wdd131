<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pakistan</title>

    <meta name="description" content="Discover Pakistan, its capital, population, weather, and important country information.">

    <meta name="author" content="Ramish Lal Khokhar">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>
</head>
<body>

<header>
    <h1>Pakistan</h1>
</header>

<main>

    <picture>
        <source media="(min-width: 768px)"
            srcset="images/pakistan-large.webp">

        <img src="images/pakistan-small.webp"
             alt="Beautiful view of Pakistan">
    </picture>

    <section class="data">
        <h2>Data</h2>

        <p><strong>Capital:</strong> Islamabad</p>
        <p><strong>Population:</strong> 241 Million</p>
        <p><strong>Area:</strong> 881,913 km²</p>
        <p><strong>Language:</strong> Urdu, English</p>
        <p><strong>Currency:</strong> Pakistani Rupee</p>
    </section>

    <section class="weather">

        <h2>Weather</h2>

        <img src="images/weather.svg"
             alt="Weather Icon"
             class="weather-icon">

        <p><strong>Temperature:</strong> <span id="temp">30</span> °C</p>

        <p><strong>Wind Speed:</strong> <span id="wind">10</span> km/h</p>

        <p><strong>Wind Chill:</strong>
            <span id="windchill"></span>
        </p>

    </section>

</main>

<footer>

    <p>
        © <span id="currentyear"></span>
        Ramish Lal Khokhar | Pakistan
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
